[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowerbird"
version = "0.1.0"
description = "Fast, resumable Instagram media scraper. HTTP first, browser only as a fallback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "makan" }]
keywords = [
    "instagram",
    "scraper",
    "downloader",
    "media",
    "reels",
    "stories",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.14",
    "curl_cffi>=0.13",
    "httpx[http2,socks]>=0.28",
    "loguru>=0.7",
    "orjson>=3.10",
    "pydantic>=2.10",
    "rich>=14.0",
    "typer>=0.15",
]

[project.optional-dependencies]
browser = ["cloakbrowser>=0.5.3", "playwright>=1.62"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "respx>=0.22"]

[project.urls]
Homepage = "https://github.com/makan/bowerbird"
Issues = "https://github.com/makan/bowerbird/issues"
Changelog = "https://github.com/makan/bowerbird/releases"

[project.scripts]
bowerbird = "bowerbird.cli.app:main"
bb = "bowerbird.cli.app:main"

[tool.setuptools.packages.find]
include = ["bowerbird*"]

[tool.setuptools.package-data]
bowerbird = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["bowerbird"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "pragma: no cover",
]

[tool.ruff]
line-length = 100
target-version = "py313"

# Selected explicitly. Relying on ruff's defaults means a ruff upgrade can
# fail CI on code nobody touched.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = [
    # Domain models are pydantic; a mutable default is the field's whole point.
    "RUF012",
    # PEP 695 generics on a pydantic BaseModel. Works, but Page[T] is public
    # API and rewriting its declaration buys nothing.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures build payloads positionally and shadow builtins freely.
"tests/*" = ["E501"]
